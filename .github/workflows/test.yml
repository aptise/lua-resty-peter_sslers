# based on
# https://github.com/ledgetech/lua-resty-http/blob/master/.github/workflows/test.yml

name: Test

on:
  push:
    paths-ignore: # Skip if only docs are updated
        - '*.md'

permissions:
  contents: read

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: leafo/gh-actions-lua@v13
      with:
        luaVersion: "luajit-openresty"
    - uses: leafo/gh-actions-luarocks@v6
      with:
        luaRocksVersion: "3.13.0"
    - run: luarocks install luacheck
    - run: luacheck lib --no-unused

  run_tests:
    strategy:
      matrix:
        openresty_version:
          - 1.29.2.4
          - 1.31.1.1

    runs-on: ubuntu-latest

    container:
      image: openresty/openresty:${{ matrix.openresty_version }}-alpine-fat
      # --init runs tinit as PID 1 and prevents the 'WARNING: killing the child process' spam from the test suite
      options: --init

    steps:
    # redis-server and the conf are installed by the package
    # see https://pkgs.alpinelinux.org/contents?branch=edge&name=redis&arch=x86_64&repo=main
    # this container doesn't seem to have the alpine linux start utilities, so daemonize it
    - name: Install deps
      run: |
        apk add --no-cache curl perl bash wget git perl-dev libarchive-tools redis
        ln -s /usr/bin/bsdtar /usr/bin/tar
        opm get ledgetech/lua-resty-http thibaultcha/lua-resty-mlcache fffonion/lua-resty-openssl
        /usr/bin/redis-server /etc/redis.conf &

    - name: Install CPAN
      run: PERL_MM_USE_DEFAULT=1 cpan App::cpanminus

    - name: Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cpan
          ~/.cache
        key: ${{ runner.os }}-${{ matrix.openresty_version }}-luarocks-3.13.0-cache

    - name: Install Test::Nginx
      run: cpanm -q -n Test::Nginx

    - name: Install Luacov
      # Bootstrap directly: old LuaRocks cannot parse large manifests under LuaJIT.
      # https://github.com/luarocks/luarocks/issues/1797
      run: |
        curl --fail --location --retry 3 -o /tmp/luarocks.src.rock https://luarocks.org/luarocks-3.13.0-1.src.rock
        luarocks install /tmp/luarocks.src.rock
        luarocks --version
        luarocks install luacov

    - uses: actions/checkout@v6

    - name: Run tests
      env:
        TEST_COVERAGE: '1'
      run: |
         /usr/bin/prove -I../test-nginx/lib -r t/

    - name: Coverage
      run: |
        luacov
        tail -n 8 luacov.report.out

  secure_backends:
    name: Secure ${{ matrix.backend }} connections
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [valkey, redis]
    container:
      image: openresty/openresty:1.31-alpine-fat
      options: --init
    steps:
      - uses: actions/checkout@v6
      - name: Install secure test dependencies
        run: |
          apk add --no-cache python3 openssl perl perl-dev make ${{ matrix.backend }}
          opm get ledgetech/lua-resty-http thibaultcha/lua-resty-mlcache fffonion/lua-resty-openssl
          PERL_MM_USE_DEFAULT=1 cpan App::cpanminus
          cpanm -n Test::Nginx
      - name: Test isolated password, TLS, and mTLS connections
        env:
          TEST_NGINX_NO_SHUFFLE: '1'
        run: python3 t/security/run.py --backend ${{ matrix.backend }} --full-suite --parallel-fixtures 2
